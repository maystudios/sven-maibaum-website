<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d44"/>
      <stop offset="100%" stop-color="#1f1f35"/>
    </linearGradient>
    <linearGradient id="slotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#080812"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSmall">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="280" y1="0" x2="280" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="440" y1="0" x2="440" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="520" y1="0" x2="520" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="560" y1="0" x2="560" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="680" y1="0" x2="680" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="760" y1="0" x2="760" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="500" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="800" y2="280" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="440" x2="800" y2="440" stroke="#6366f1" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="800" y2="480" stroke="#6366f1" stroke-width="0.5"/>
  </g>

  <!-- Floppy disk -->
  <g transform="translate(280, 80)">
    <!-- Disk body -->
    <rect x="0" y="0" width="240" height="250" rx="6" fill="url(#diskGrad)" stroke="#2a2a4a" stroke-width="1.5"/>

    <!-- Metal slider top -->
    <rect x="70" y="0" width="100" height="40" rx="2" fill="#1a1a30" stroke="#333355" stroke-width="0.8"/>
    <rect x="95" y="5" width="50" height="30" rx="1" fill="#0f0f1a"/>

    <!-- Label area -->
    <rect x="20" y="55" width="200" height="120" rx="3" fill="url(#labelGrad)" stroke="#3a3a5a" stroke-width="0.5"/>

    <!-- Label text -->
    <text x="120" y="90" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#c43333" filter="url(#glowSmall)">DISK INSERTED</text>
    <text x="120" y="112" text-anchor="middle" font-family="monospace" font-size="9" fill="#666680">HHU GAME JAM 2026</text>
    <text x="120" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="#555570">TEAM VEGAN &amp; NATURAL</text>
    <line x1="35" y1="140" x2="205" y2="140" stroke="#3a3a5a" stroke-width="0.5"/>
    <text x="120" y="157" text-anchor="middle" font-family="monospace" font-size="7" fill="#444460">UNREAL ENGINE 5.7 // FIRST-PERSON HORROR</text>
    <text x="120" y="168" text-anchor="middle" font-family="monospace" font-size="7" fill="#c43333" opacity="0.7">!! DO NOT INSERT !!</text>

    <!-- Bottom read window -->
    <rect x="60" y="195" width="120" height="40" rx="3" fill="url(#slotGrad)" stroke="#2a2a4a" stroke-width="1"/>
    <circle cx="120" cy="215" r="12" fill="none" stroke="#222240" stroke-width="1"/>
    <circle cx="120" cy="215" r="4" fill="#222240"/>

    <!-- Corner notch -->
    <rect x="5" y="200" width="15" height="30" rx="2" fill="#0f0f1a"/>
  </g>

  <!-- Glitch lines -->
  <g opacity="0.15">
    <rect x="0" y="185" width="800" height="1" fill="#c43333"/>
    <rect x="0" y="310" width="800" height="1" fill="#c43333"/>
    <rect x="200" y="190" width="350" height="2" fill="#c43333" opacity="0.3"/>
  </g>

  <!-- Title text -->
  <text x="400" y="400" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e8e8f0" filter="url(#glow)">DISK INSERTED</text>
  <text x="400" y="430" text-anchor="middle" font-family="monospace" font-size="12" fill="#8888aa">First-Person Horror // 56h Game Jam // UE 5.7</text>
  <text x="400" y="455" text-anchor="middle" font-family="monospace" font-size="10" fill="#c43333" filter="url(#glowSmall)" opacity="0.8">What's on the disk will find you.</text>

  <!-- Vignette overlay -->
  <rect width="800" height="500" fill="url(#vignette)"/>
</svg>
