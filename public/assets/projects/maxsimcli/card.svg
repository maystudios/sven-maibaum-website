<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(39,39,42,0.5)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="rgba(9,9,11,0)"/>
      <stop offset="100%" stop-color="rgba(9,9,11,0.85)"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.07)"/>
      <stop offset="100%" stop-color="rgba(9,9,11,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#09090b"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#glow)"/>
  <rect width="600" height="400" fill="url(#vignette)"/>

  <!-- Top accent line -->
  <line x1="0" y1="0" x2="600" y2="0" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>

  <!-- Diamond geometric pattern (background) -->
  <g transform="translate(460, 180)" opacity="0.12">
    <rect x="-80" y="-80" width="160" height="160" fill="none" stroke="#3b82f6" stroke-width="0.7" transform="rotate(45)"/>
    <rect x="-55" y="-55" width="110" height="110" fill="none" stroke="#3b82f6" stroke-width="0.5" transform="rotate(45)"/>
    <rect x="-30" y="-30" width="60" height="60" fill="none" stroke="#3b82f6" stroke-width="0.5" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="4" fill="#3b82f6" opacity="0.7"/>
  </g>

  <!-- CLI TOOL eyebrow -->
  <g>
    <line x1="40" y1="72" x2="68" y2="72" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
    <text x="74" y="76" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="rgba(59,130,246,0.7)" letter-spacing="2.5">CLI TOOL</text>
    <line x1="147" y1="72" x2="175" y2="72" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  </g>

  <!-- MaxsimCLI title -->
  <text x="40" y="135" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="52" font-weight="800" letter-spacing="-2.5" fill="#fafafa">MaxsimCLI</text>

  <!-- Subtitle -->
  <text x="40" y="168" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="16" font-weight="500" fill="rgba(161,161,170,0.75)" letter-spacing="-0.3">AI-Powered Context Engineering</text>

  <!-- Description -->
  <text x="40" y="205" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="rgba(161,161,170,0.5)">Structured prompts, dedicated agents, and spec-driven</text>
  <text x="40" y="222" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="rgba(161,161,170,0.5)">planning for Claude Code.</text>

  <!-- Terminal preview -->
  <rect x="40" y="250" width="380" height="108" rx="4" fill="rgba(24,24,27,0.95)" stroke="rgba(63,63,70,0.5)" stroke-width="0.7"/>
  <!-- Dots -->
  <circle cx="58" cy="268" r="3.5" fill="rgba(239,68,68,0.5)"/>
  <circle cx="71" cy="268" r="3.5" fill="rgba(234,179,8,0.5)"/>
  <circle cx="84" cy="268" r="3.5" fill="rgba(34,197,94,0.5)"/>
  <text x="98" y="272" font-family="'SF Mono','Fira Code',monospace" font-size="8" fill="rgba(161,161,170,0.4)" letter-spacing="0.5">maxsim workflow</text>
  <!-- Separator -->
  <line x1="40" y1="280" x2="420" y2="280" stroke="rgba(63,63,70,0.4)" stroke-width="0.5"/>
  <!-- Terminal content -->
  <text x="56" y="300" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="rgba(59,130,246,0.8)">$</text>
  <text x="72" y="300" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="rgba(250,250,250,0.85)">/maxsim:plan</text>
  <text x="56" y="316" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="rgba(161,161,170,0.45)">&gt; Planning phase 02-Auth-System...</text>
  <text x="56" y="330" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="rgba(161,161,170,0.45)">&gt; Spawning researcher agent</text>
  <text x="56" y="344" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="rgba(34,197,94,0.55)">&gt; Research complete. 4 decisions captured.</text>

  <!-- Version -->
  <text x="560" y="385" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="rgba(59,130,246,0.35)" letter-spacing="0.5">v5.22.0</text>
</svg>
