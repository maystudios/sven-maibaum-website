<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(39,39,42,0.5)" stroke-width="0.5"/>
    </pattern>
    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="rgba(9,9,11,0)"/>
      <stop offset="100%" stop-color="rgba(9,9,11,0.9)"/>
    </radialGradient>
    <!-- Blue center glow -->
    <radialGradient id="glow" cx="35%" cy="55%" r="40%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.06)"/>
      <stop offset="100%" stop-color="rgba(9,9,11,0)"/>
    </radialGradient>
    <!-- Diamond glow -->
    <radialGradient id="diamondGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.12)"/>
      <stop offset="100%" stop-color="rgba(9,9,11,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#09090b"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>
  <rect width="1200" height="500" fill="url(#vignette)"/>

  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>

  <!-- Diamond geometric pattern (right side) -->
  <g transform="translate(920, 250)" opacity="0.15">
    <rect x="-100" y="-100" width="200" height="200" fill="none" stroke="#3b82f6" stroke-width="0.8" transform="rotate(45)"/>
    <rect x="-70" y="-70" width="140" height="140" fill="none" stroke="#3b82f6" stroke-width="0.5" transform="rotate(45)"/>
    <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#3b82f6" stroke-width="0.5" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="5" fill="#3b82f6" opacity="0.8"/>
    <!-- Corner dots -->
    <circle cx="0" cy="-100" r="2" fill="#3b82f6" opacity="0.5"/>
    <circle cx="100" cy="0" r="2" fill="#3b82f6" opacity="0.5"/>
    <circle cx="0" cy="100" r="2" fill="#3b82f6" opacity="0.5"/>
    <circle cx="-100" cy="0" r="2" fill="#3b82f6" opacity="0.5"/>
    <!-- Connecting lines to corners -->
    <line x1="-140" y1="-140" x2="-100" y2="-100" stroke="#3b82f6" stroke-width="0.4" transform="rotate(45)"/>
    <line x1="100" y1="-100" x2="140" y2="-140" stroke="#3b82f6" stroke-width="0.4" transform="rotate(45)"/>
    <line x1="100" y1="100" x2="140" y2="140" stroke="#3b82f6" stroke-width="0.4" transform="rotate(45)"/>
    <line x1="-140" y1="140" x2="-100" y2="100" stroke="#3b82f6" stroke-width="0.4" transform="rotate(45)"/>
  </g>

  <!-- Version tag near diamond -->
  <text x="920" y="410" text-anchor="middle" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="rgba(59,130,246,0.4)" letter-spacing="1">v5.22.0</text>

  <!-- CLI TOOL eyebrow -->
  <g>
    <line x1="80" y1="95" x2="115" y2="95" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
    <text x="122" y="99" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="rgba(59,130,246,0.7)" letter-spacing="3">CLI TOOL</text>
    <line x1="210" y1="95" x2="245" y2="95" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
  </g>

  <!-- MaxsimCLI title -->
  <text x="80" y="175" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="72" font-weight="800" letter-spacing="-3" fill="#fafafa">MaxsimCLI</text>

  <!-- Subtitle -->
  <text x="80" y="215" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="22" font-weight="500" fill="rgba(161,161,170,0.8)" letter-spacing="-0.5">AI-Powered Context Engineering</text>

  <!-- Description -->
  <text x="80" y="260" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="rgba(161,161,170,0.6)" letter-spacing="0.2">Structured prompts, dedicated agents, and spec-driven</text>
  <text x="80" y="280" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="rgba(161,161,170,0.6)" letter-spacing="0.2">planning for Claude Code. Each task gets a fresh-context</text>
  <text x="80" y="300" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="rgba(161,161,170,0.6)" letter-spacing="0.2">subagent, so your project state stays intact.</text>

  <!-- Install command bar -->
  <rect x="80" y="325" width="460" height="38" rx="4" fill="rgba(24,24,27,0.9)" stroke="rgba(63,63,70,0.6)" stroke-width="0.7"/>
  <text x="100" y="349" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="rgba(59,130,246,0.8)">$</text>
  <text x="118" y="349" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="rgba(134,239,172,0.9)">npx maxsimcli@latest</text>
  <text x="500" y="349" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="rgba(161,161,170,0.4)">copy</text>

  <!-- Terminal preview -->
  <rect x="80" y="378" width="460" height="108" rx="4" fill="rgba(24,24,27,0.95)" stroke="rgba(63,63,70,0.4)" stroke-width="0.7"/>
  <!-- Terminal dots -->
  <circle cx="100" cy="396" r="4" fill="rgba(239,68,68,0.5)"/>
  <circle cx="115" cy="396" r="4" fill="rgba(234,179,8,0.5)"/>
  <circle cx="130" cy="396" r="4" fill="rgba(34,197,94,0.5)"/>
  <text x="148" y="400" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="rgba(161,161,170,0.4)" letter-spacing="0.5">maxsim workflow</text>
  <!-- Separator -->
  <line x1="80" y1="410" x2="540" y2="410" stroke="rgba(63,63,70,0.4)" stroke-width="0.5"/>
  <!-- Terminal content -->
  <text x="100" y="432" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="rgba(59,130,246,0.8)">$</text>
  <text x="118" y="432" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="rgba(250,250,250,0.85)">/maxsim:plan</text>
  <text x="100" y="450" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="rgba(161,161,170,0.5)">  &gt; Planning phase 02-Auth-System...</text>
  <text x="100" y="466" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="rgba(161,161,170,0.5)">  &gt; Spawning researcher agent (claude-sonnet-4)</text>
  <text x="100" y="482" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="rgba(34,197,94,0.6)">  &gt; Research complete. 4 decisions captured.</text>
</svg>
