<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HydroLoop</title>
  <desc id="desc">Abstrakte blaue Rohrschleife für das Mobile-3D-Puzzle HydroLoop</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071726"/>
      <stop offset="0.55" stop-color="#0b4265"/>
      <stop offset="1" stop-color="#1194bd"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset="0.45" stop-color="#62e4ff"/>
      <stop offset="1" stop-color="#1aa8d7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#72e9ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#72e9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#d6f8ff" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#03121d" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="925" cy="425" rx="550" ry="420" fill="url(#glow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M610 310H955c132 0 238 106 238 238s-106 238-238 238H715c-133 0-240-107-240-240V434"
      stroke="#031a29" stroke-width="96"/>
    <path d="M610 310H955c132 0 238 106 238 238s-106 238-238 238H715c-133 0-240-107-240-240V434"
      stroke="url(#pipe)" stroke-width="66"/>
    <path d="M610 310H955c132 0 238 106 238 238"
      stroke="#ffffff" stroke-opacity="0.32" stroke-width="8"/>
  </g>

  <g>
    <circle cx="610" cy="310" r="70" fill="#082b40" stroke="#98efff" stroke-width="12"/>
    <circle cx="610" cy="310" r="26" fill="#a7f3ff"/>
    <circle cx="475" cy="434" r="70" fill="#082b40" stroke="#98efff" stroke-width="12"/>
    <circle cx="475" cy="434" r="26" fill="#a7f3ff"/>
  </g>

  <g fill="#ffffff">
    <text x="110" y="690" font-family="Geist, sans-serif" font-size="108" font-weight="800" letter-spacing="-4">HYDROLOOP</text>
    <text x="118" y="755" font-family="Geist, sans-serif" font-size="25" font-weight="700" letter-spacing="8" fill="#9feeff">3D-ROHR-PUZZLE · MOBILE</text>
  </g>

  <g transform="translate(1300 116)">
    <rect width="174" height="46" rx="23" fill="#d8fbff" fill-opacity="0.13" stroke="#b6f5ff" stroke-opacity="0.35"/>
    <text x="87" y="30" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#d8fbff">IN ENTWICKLUNG</text>
  </g>
</svg>
